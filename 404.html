      border-radius: 20px;
      padding: 56px 48px;
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      text-align: center;

    .download-card .app-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      display: block;
    }

    .download-card .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #7FB8FF;
      background: rgba(127,184,255,0.10);
      border: 1px solid rgba(127,184,255,0.20);
      border-radius: 20px;
      padding: 5px 14px;
      margin-bottom: 24px;
    }

    .download-card h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    .download-card .sub {
      font-size: 15px;
      color: rgba(255,255,255,0.55);
      margin-bottom: 36px;
      line-height: 1.6;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(50,110,225,0.52);
      border: 1px solid rgba(120,185,255,0.38);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 0 24px rgba(50,110,225,0.35);
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-decoration: none;
      border-radius: 10px;
      padding: 14px 28px;
      transition: all 0.25s cubic-bezier(0.23,1,0.32,1);
      margin-bottom: 28px;
    }

    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), 0 0 36px rgba(50,110,225,0.5);
    }

    .download-btn:active {
      transform: scale(0.97);
    }

    .other-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      border-top: 1px solid rgba(255,255,255,0.07);
      padding-top: 24px;
      font-size: 13px;
    }

    .other-links a {
      color: rgba(255,255,255,0.45);
      text-decoration: none;
      transition: color 0.2s;
    }

    .other-links a:hover {
      color: #7FB8FF;
    }
  </style>
  <meta name="robots" content="noindex, nofollow" />
